<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap Media Gallery - NaUkToJim</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        snap: '#FFFC00',
                        snapDark: '#0A0A0A',
                        snapCard: '#18181B',
                        snapBorder: '#27272A'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        /* Snapchat Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FFFC00;
        }
        /* Snapchat Glow Effect */
        .snap-glow {
            box-shadow: 0 0 25px rgba(255, 252, 0, 0.25);
        }
        .snap-glass {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        /* Story Progress Bar */
        @keyframes storyProgress {
            from { width: 0%; }
            to { width: 100%; }
        }
        .animate-progress {
            animation: storyProgress linear forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-black text-white antialiased">

    <!-- Notification Toast -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-full max-w-xs px-4"></div>

    <!-- Snapchat Style Sticky Navigation -->
    <header class="sticky top-0 z-30 snap-glass border-b border-white/10 px-4 py-3 sm:px-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Brand Badge -->
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-2xl bg-snap text-black flex items-center justify-center font-black text-xl shadow-md snap-glow">
                    <i class="fa-ghost fa-solid"></i>
                </div>
                <div class="hidden sm:block">
                    <h1 class="text-sm font-extrabold tracking-tight text-white leading-none">NaUkToJim</h1>
                    <span class="text-[10px] text-white/50 font-medium">prakharrpatel</span>
                </div>
            </div>

            <!-- Snapchat Pill Tabs -->
            <div class="flex p-1 bg-white/10 rounded-full border border-white/10 backdrop-blur-md">
                <button data-filter="all" class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-snap text-black shadow-sm">
                    All
                </button>
                <button data-filter="image" class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all text-white/70 hover:text-white">
                    Photos
                </button>
                <button data-filter="video" class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold transition-all text-white/70 hover:text-white">
                    Videos
                </button>
            </div>

            <!-- Search Field -->
            <div class="relative flex items-center">
                <input type="text" id="search-input" placeholder="Search..." class="w-28 sm:w-44 py-1.5 pl-8 pr-3 text-xs rounded-full bg-white/10 border border-white/10 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-snap focus:w-48 sm:focus:w-56 transition-all duration-300">
                <i class="fa-solid fa-magnifying-glass absolute left-3 text-white/40 text-xs"></i>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 py-6 flex-grow w-full">

        <!-- Loading Skeleton Grid -->
        <div id="loading-state" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
            <script>
                document.write(Array(10).fill(0).map(() => `
                    <div class="aspect-[9/16] rounded-3xl bg-white/5 animate-pulse border border-white/5"></div>
                `).join(''));
            </script>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="w-14 h-14 rounded-full bg-snap/10 text-snap flex items-center justify-center text-xl mb-3 border border-snap/20">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <p id="error-message" class="text-xs font-semibold text-white/80 mb-4">Unable to load media from repository.</p>
            <button id="retry-btn" class="px-5 py-2 bg-snap text-black rounded-full text-xs font-black hover:scale-105 active:scale-95 transition shadow-lg snap-glow">
                Retry Fetch
            </button>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-24 text-center">
            <i class="fa-ghost fa-solid text-4xl text-white/20 mb-3"></i>
            <p class="text-xs font-bold text-white/50">No media found in repository</p>
        </div>

        <!-- Snapchat Visual Media Grid -->
        <div id="gallery-grid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
            <!-- Dynamic cards inject here -->
        </div>
    </main>

    <!-- Fullscreen Story / Lightbox Modal -->
    <div id="story-modal" class="fixed inset-0 z-50 hidden bg-black flex flex-col justify-between p-0 sm:p-4 transition-opacity duration-200 opacity-0">
        
        <!-- Story Viewport Container -->
        <div class="relative w-full h-full max-w-md mx-auto bg-snapDark sm:rounded-3xl overflow-hidden flex flex-col justify-between shadow-2xl border border-white/10">
            
            <!-- Top Overlay Controls & Story Progress -->
            <div class="absolute top-0 left-0 right-0 z-30 p-3 bg-gradient-to-b from-black/80 via-black/40 to-transparent flex flex-col gap-2">
                
                <!-- Story Bar -->
                <div class="w-full bg-white/30 h-1 rounded-full overflow-hidden">
                    <div id="story-progress-bar" class="bg-snap h-full w-0"></div>
                </div>

                <!-- Header Actions -->
                <div class="flex items-center justify-between pt-1">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-snap text-black flex items-center justify-center text-xs font-black">
                            <i class="fa-ghost fa-solid"></i>
                        </div>
                        <span id="modal-title" class="text-xs font-bold text-white truncate max-w-[170px]">Media Snap</span>
                    </div>

                    <div class="flex items-center gap-1.5">
                        <button id="modal-download-btn" title="Download" class="w-8 h-8 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center text-xs backdrop-blur-md transition border border-white/10">
                            <i class="fa-solid fa-arrow-down"></i>
                        </button>
                        <button id="modal-share-btn" title="Share" class="w-8 h-8 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center text-xs backdrop-blur-md transition border border-white/10">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                        <button id="modal-close-btn" title="Close" class="w-8 h-8 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center text-xs backdrop-blur-md transition border border-white/10">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tap Navigation Zones -->
            <div id="tap-prev" class="absolute left-0 top-16 bottom-20 w-1/3 z-20 cursor-pointer"></div>
            <div id="tap-next" class="absolute right-0 top-16 bottom-20 w-2/3 z-20 cursor-pointer"></div>

            <!-- Media Content Stage -->
            <div class="w-full h-full flex items-center justify-center bg-black">
                <img id="modal-image" class="hidden w-full h-full object-contain" src="" alt="Snap Preview">
                <video id="modal-video" class="hidden w-full h-full object-contain" playsinline autoplay>
                    Your browser does not support HTML5 video.
                </video>
            </div>

            <!-- Bottom Floating Action Bar -->
            <div class="absolute bottom-4 left-4 right-4 z-30 flex items-center gap-2">
                <button id="bottom-share-pill" class="flex-1 py-3 px-5 rounded-full bg-white/15 hover:bg-white/25 backdrop-blur-xl border border-white/20 text-white text-xs font-bold flex items-center justify-center gap-2 transition active:scale-95">
                    <i class="fa-solid fa-share-nodes text-snap"></i> Share Snap
                </button>
                <button id="bottom-download-pill" class="w-11 h-11 rounded-full bg-snap text-black flex items-center justify-center text-sm font-black transition hover:scale-105 active:scale-95 shadow-lg snap-glow">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const REPO_OWNER = 'prakharrpatel';
        const REPO_NAME = 'NaUkToJim';
        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;

        const IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'];
        const VIDEO_EXTS = ['mp4', 'webm', 'mov', 'ogg', 'm4v'];

        let allMedia = [];
        let filteredMedia = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let currentModalIndex = -1;
        let storyTimer = null;

        // Elements
        const galleryGrid = document.getElementById('gallery-grid');
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const tabBtns = document.querySelectorAll('.tab-btn');

        // Modal Elements
        const storyModal = document.getElementById('story-modal');
        const modalImage = document.getElementById('modal-image');
        const modalVideo = document.getElementById('modal-video');
        const modalTitle = document.getElementById('modal-title');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const modalDownloadBtn = document.getElementById('modal-download-btn');
        const modalShareBtn = document.getElementById('modal-share-btn');
        const bottomSharePill = document.getElementById('bottom-share-pill');
        const bottomDownloadPill = document.getElementById('bottom-download-pill');
        const progressBar = document.getElementById('story-progress-bar');
        const tapPrev = document.getElementById('tap-prev');
        const tapNext = document.getElementById('tap-next');

        window.addEventListener('DOMContentLoaded', () => {
            fetchRepositoryMedia();
            setupEventListeners();
        });

        // Recursively Fetch GitHub Contents
        async function fetchRepositoryMedia() {
            showLoading();
            allMedia = [];
            try {
                await recursiveFetchContents(API_URL);
                if (allMedia.length === 0) {
                    showEmpty();
                } else {
                    applyFilters();
                }
            } catch (err) {
                showError(err.message || 'Error connecting to GitHub repository');
            }
        }

        async function recursiveFetchContents(url) {
            const response = await fetch(url);
            if (!response.ok) {
                if (response.status === 403) {
                    throw new Error('GitHub API rate limit reached. Please try again later.');
                }
                throw new Error('Failed to fetch contents from repository');
            }
            const contents = await response.json();
            const items = Array.isArray(contents) ? contents : [contents];

            for (const item of items) {
                if (item.type === 'file') {
                    const ext = item.name.split('.').pop().toLowerCase();
                    let mediaType = null;

                    if (IMAGE_EXTS.includes(ext)) mediaType = 'image';
                    else if (VIDEO_EXTS.includes(ext)) mediaType = 'video';

                    if (mediaType) {
                        allMedia.push({
                            name: item.name,
                            path: item.path,
                            url: item.download_url || `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${item.path}`,
                            type: mediaType
                        });
                    }
                } else if (item.type === 'dir') {
                    await recursiveFetchContents(item.url);
                }
            }
        }

        // Apply Search & Filter Tabs
        function applyFilters() {
            filteredMedia = allMedia.filter(item => {
                const matchesFilter = currentFilter === 'all' || item.type === currentFilter;
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.path.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            renderGrid();
        }

        // Render Snapchat Card Grid
        function renderGrid() {
            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');

            if (filteredMedia.length === 0) {
                galleryGrid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            galleryGrid.classList.remove('hidden');
            galleryGrid.innerHTML = '';

            filteredMedia.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'group relative aspect-[9/16] bg-snapCard rounded-3xl overflow-hidden cursor-pointer border border-snapBorder hover:border-snap/60 transition-all duration-300 transform hover:-translate-y-1 shadow-lg';
                card.onclick = () => openModal(index);

                if (item.type === 'image') {
                    card.innerHTML = `
                        <img src="${item.url}" alt="${item.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80"></div>
                        <div class="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md text-[10px] font-extrabold text-snap flex items-center gap-1 border border-white/10">
                            <i class="fa-solid fa-camera"></i> PHOTO
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <video src="${item.url}" class="w-full h-full object-cover" muted loop preload="metadata"></video>
                        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 flex items-center justify-center">
                            <div class="w-10 h-10 rounded-full bg-snap text-black flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-play text-xs ml-0.5"></i>
                            </div>
                        </div>
                        <div class="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md text-[10px] font-extrabold text-snap flex items-center gap-1 border border-white/10">
                            <i class="fa-solid fa-video"></i> VIDEO
                        </div>
                    `;
                }

                // Hover Actions Container
                const cardOverlay = document.createElement('div');
                cardOverlay.className = 'absolute bottom-3 left-3 right-3 flex items-center justify-between z-10';
                cardOverlay.innerHTML = `
                    <span class="text-xs font-bold text-white truncate max-w-[70%] drop-shadow-md">${item.name}</span>
                    <button class="card-dl-btn w-8 h-8 rounded-full bg-white/20 hover:bg-snap hover:text-black text-white text-xs flex items-center justify-center backdrop-blur-md transition border border-white/10">
                        <i class="fa-solid fa-arrow-down"></i>
                    </button>
                `;

                cardOverlay.querySelector('.card-dl-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    downloadMedia(item.url, item.name);
                });

                card.appendChild(cardOverlay);
                galleryGrid.appendChild(card);
            });
        }

        // Story Lightbox Modal Logic
        function openModal(index) {
            if (index < 0 || index >= filteredMedia.length) return;
            currentModalIndex = index;
            const item = filteredMedia[index];

            modalTitle.textContent = item.name;
            resetStoryProgress();

            if (item.type === 'image') {
                modalVideo.pause();
                modalVideo.classList.add('hidden');
                modalImage.src = item.url;
                modalImage.classList.remove('hidden');
                startStoryProgress(5000); // 5s for image stories
            } else {
                modalImage.classList.add('hidden');
                modalVideo.src = item.url;
                modalVideo.classList.remove('hidden');
                modalVideo.currentTime = 0;
                
                modalVideo.play().then(() => {
                    const duration = (modalVideo.duration && !isNaN(modalVideo.duration)) ? modalVideo.duration * 1000 : 8000;
                    startStoryProgress(duration);
                }).catch(() => {
                    startStoryProgress(5000);
                });

                modalVideo.onended = () => navModal(1);
            }

            storyModal.classList.remove('hidden');
            requestAnimationFrame(() => storyModal.classList.remove('opacity-0'));
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            storyModal.classList.add('opacity-0');
            modalVideo.pause();
            resetStoryProgress();
            setTimeout(() => {
                storyModal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 200);
        }

        function navModal(dir) {
            let nextIndex = currentModalIndex + dir;
            if (nextIndex < 0) nextIndex = filteredMedia.length - 1;
            if (nextIndex >= filteredMedia.length) nextIndex = 0;
            openModal(nextIndex);
        }

        function startStoryProgress(durationMs) {
            resetStoryProgress();
            progressBar.style.transition = `width ${durationMs}ms linear`;
            requestAnimationFrame(() => {
                progressBar.style.width = '100%';
            });
            storyTimer = setTimeout(() => {
                navModal(1);
            }, durationMs);
        }

        function resetStoryProgress() {
            clearTimeout(storyTimer);
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';
        }

        // Direct Download via Fetch Blob
        async function downloadMedia(url, filename) {
            showToast('Starting download...', 'snap');
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                URL.revokeObjectURL(blobUrl);
                a.remove();
                showToast('Download complete!', 'success');
            } catch (e) {
                window.open(url, '_blank');
            }
        }

        // Web Share API with Fallback
        async function shareMedia(item) {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: item.name,
                        url: item.url
                    });
                    showToast('Shared successfully!', 'success');
                } catch (e) {
                    if (e.name !== 'AbortError') copyToClipboard(item.url);
                }
            } else {
                copyToClipboard(item.url);
            }
        }

        function copyToClipboard(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('Link copied to clipboard!', 'snap');
            } catch (e) {
                showToast('Failed to copy link', 'error');
            }
            ta.remove();
        }

        // Event Setup
        function setupEventListeners() {
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => {
                        b.classList.remove('bg-snap', 'text-black', 'shadow-sm');
                        b.classList.add('text-white/70');
                    });
                    btn.classList.add('bg-snap', 'text-black', 'shadow-sm');
                    btn.classList.remove('text-white/70');

                    currentFilter = btn.dataset.filter;
                    applyFilters();
                });
            });

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                applyFilters();
            });

            modalCloseBtn.addEventListener('click', closeModal);
            tapPrev.addEventListener('click', () => navModal(-1));
            tapNext.addEventListener('click', () => navModal(1));

            modalDownloadBtn.addEventListener('click', () => downloadMedia(filteredMedia[currentModalIndex].url, filteredMedia[currentModalIndex].name));
            bottomDownloadPill.addEventListener('click', () => downloadMedia(filteredMedia[currentModalIndex].url, filteredMedia[currentModalIndex].name));

            modalShareBtn.addEventListener('click', () => shareMedia(filteredMedia[currentModalIndex]));
            bottomSharePill.addEventListener('click', () => shareMedia(filteredMedia[currentModalIndex]));

            document.addEventListener('keydown', (e) => {
                if (storyModal.classList.contains('hidden')) return;
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowLeft') navModal(-1);
                if (e.key === 'ArrowRight') navModal(1);
            });

            document.getElementById('retry-btn').addEventListener('click', fetchRepositoryMedia);
        }

        function showLoading() {
            loadingState.classList.remove('hidden');
            galleryGrid.classList.add('hidden');
            errorState.classList.add('hidden');
            emptyState.classList.add('hidden');
        }

        function showEmpty() {
            loadingState.classList.add('hidden');
            galleryGrid.classList.add('hidden');
            errorState.classList.add('hidden');
            emptyState.classList.remove('hidden');
        }

        function showError(msg) {
            loadingState.classList.add('hidden');
            galleryGrid.classList.add('hidden');
            emptyState.classList.add('hidden');
            document.getElementById('error-message').textContent = msg;
            errorState.classList.remove('hidden');
        }

        function showToast(msg, type = 'snap') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bgClass = 'bg-snap text-black font-black snap-glow';
            if (type === 'success') bgClass = 'bg-emerald-400 text-black font-black';
            if (type === 'error') bgClass = 'bg-rose-500 text-white font-black';

            toast.className = `px-4 py-2.5 rounded-full text-xs text-center shadow-2xl transition-all duration-300 transform translate-y-[-10px] opacity-0 ${bgClass}`;
            toast.textContent = msg;

            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-10px]', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
